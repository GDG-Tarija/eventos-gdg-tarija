<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>GDG Tarija — Plataforma de Eventos</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Meta SEO General por defecto (para scrapers sin soporte JS como WhatsApp) -->
    <meta
      name="description"
      content="Plataforma de eventos de Google Developer Groups Tarija. Regístrate a talleres, conferencias y consulta tus certificados oficiales de asistencia."
    />

    <!-- Open Graph por defecto -->
    <meta property="og:title" content="GDG Tarija — Plataforma de Eventos" />
    <meta
      property="og:description"
      content="Regístrate a talleres, conferencias y consulta tus certificados oficiales de asistencia de Google Developer Groups Tarija."
    />
    <meta
      property="og:image"
      content="https://res.cloudinary.com/dopkch3x9/image/upload/v1779579233/GDG_Bevy_DefaultEventBanner_VKOwYjb_c913np.webp"
    />
    <meta property="og:type" content="website" />

    <!-- Twitter Cards por defecto -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GDG Tarija — Plataforma de Eventos" />
    <meta
      name="twitter:description"
      content="Regístrate a talleres, conferencias y consulta tus certificados oficiales de asistencia de Google Developer Groups Tarija."
    />
    <meta
      name="twitter:image"
      content="https://res.cloudinary.com/dopkch3x9/image/upload/v1779579233/GDG_Bevy_DefaultEventBanner_VKOwYjb_c913np.webp"
    />

    <!-- Fonts are served locally from src/assets/fonts/ -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"
      rel="stylesheet"
    />
    <!-- Keep Material Icons for <mat-icon> ligatures in existing UI -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
